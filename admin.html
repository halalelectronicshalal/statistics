<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>አስተዳዳሪ · ጅማ ሥራ ፖርታል</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="grad"><div class="wrap"><nav>
  <a class="logo" href="./admin.html"><i aria-hidden="true">🔒</i>የጅማ አስተዳዳሪ</a>
  <a class="l" href="./">ሕዝብ ገጽ ይመልከቱ</a>
  <button class="btn ghost sm" id="logout" hidden>ውጣ</button>
</nav></div></header>

<form class="card login" id="login">
  <h2>የአስተዳዳሪ መግቢያ</h2>
  <label>ስልክ ቁጥር<input type="tel" id="phone" inputmode="numeric" placeholder="09XXXXXXXX" required autocomplete="username"></label>
  <label>የይለፍ ቃል<input type="password" id="pw" required autocomplete="current-password"></label>
  <p class="err" id="err" role="alert" hidden></p>
  <button class="btn" type="submit">ግባ</button>
</form>

<main class="wrap" id="dash" hidden style="padding-top:24px;padding-bottom:48px">
  <h1 style="font-size:26px">የአስተዳዳሪ ገጽ</h1>
  <div class="stats" id="stats"></div>
  <form class="card form" id="form"><h2 class="full">አዲስ ሥራ ያትሙ</h2>
    <label>የሥራ ርዕስ<input name="title" required></label>
    <label>የድርጅት ስም<input name="company" required></label>
    <label>ዘርፍ<select name="sector" id="sector"></select></label>
    <label>የቅጥር ዓይነት<select name="type" id="type"></select></label>
    <label>ደመወዝ<input name="salary" placeholder="ለምሳሌ፦ 8,000 ብር በወር"></label>
    <label>ቦታ<input name="location" value="ጅማ" required></label>
    <label>የመጨረሻ ቀን<input type="date" name="deadline" required></label>
    <label style="align-content:end"><span><input type="checkbox" name="vip" style="width:auto"> ተመራጭ (VIP) አድርግ</span></label>
    <label class="full">መግለጫና እንዴት ማመልከት<textarea name="desc" rows="4" required></textarea></label>
    <div class="full"><button class="btn" type="submit">ሥራውን አትም</button></div>
  </form>
  <div class="card tbl"><table><thead><tr><th>ሥራ</th><th>ድርጅት</th><th>የመጨረሻ ቀን</th><th>ሁኔታ</th><th>እርምጃዎች</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>

<script type="module">
import { db, auth, SECTORS, TYPES, esc, fmt, isOpen, toast } from "./firebase-config.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $ = s => document.querySelector(s);
let jobs = [], unsubs = [], pendingAds = 0;
$("#sector").innerHTML = SECTORS.map(s => `<option>${esc(s)}</option>`).join("");
$("#type").innerHTML = TYPES.map(s => `<option>${esc(s)}</option>`).join("");

// ስልክ ቁጥር ወደ Firebase ኢሜል ቅርጸት ይቀየራል (ለምሳሌ 0917794343@jimmajobs.app)
const phoneToEmail = p => p.replace(/\D/g,"") + "@jimmajobs.app";

$("#login").onsubmit = async e => {
  e.preventDefault(); $("#err").hidden = true;
  try { await signInWithEmailAndPassword(auth, phoneToEmail($("#phone").value), $("#pw").value); }
  catch (err) {
    console.error(err);
    const M = {
      "auth/invalid-credential":"ስልክ ቁጥር ወይም የይለፍ ቃል ትክክል አይደለም።",
      "auth/wrong-password":"ስልክ ቁጥር ወይም የይለፍ ቃል ትክክል አይደለም።",
      "auth/user-not-found":"ይህ ስልክ ቁጥር በ Firebase ውስጥ አልተመዘገበም።",
      "auth/invalid-email":"የስልክ ቁጥሩ ቅርጽ ትክክል አይደለም።",
      "auth/invalid-api-key":"የ Firebase ቅንብር (apiKey) ትክክል አይደለም። firebase-config.js ን ያረጋግጡ።",
      "auth/api-key-not-valid":"የ Firebase ቅንብር (apiKey) ትክክል አይደለም። firebase-config.js ን ያረጋግጡ።",
      "auth/unauthorized-domain":"ይህ ዶሜን በ Firebase አልተፈቀደም። በ Authorized domains ውስጥ ያክሉት።",
      "auth/operation-not-allowed":"Email/Password በ Firebase አልበራም።",
      "auth/network-request-failed":"የኢንተርኔት ግንኙነት የለም።",
      "auth/too-many-requests":"ብዙ ጊዜ ሞክረዋል። ጥቂት ቆይተው ይሞክሩ።"
    };
    $("#err").textContent = (M[err.code] || "ስህተት፦ " + (err.code || err.message)) + (M[err.code] ? "" : "");
    $("#err").hidden = false;
  }
};
$("#logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $("#login").hidden = !!user; $("#dash").hidden = !user; $("#logout").hidden = !user;
  unsubs.forEach(u => u()); unsubs = [];
  if(!user) return;
  unsubs.push(onSnapshot(query(collection(db,"jobs"), orderBy("createdAt","desc")), s => { jobs = s.docs.map(d => ({id:d.id, ...d.data()})); draw(); }));
  unsubs.push(onSnapshot(query(collection(db,"ads"), where("status","==","pending")), s => { pendingAds = s.size; draw(); }, () => {}));
});

function draw(){
  const open = jobs.filter(isOpen).length;
  $("#stats").innerHTML = [[open,"ጠቅላላ ንቁ ሥራዎች","var(--open)"],[jobs.length-open,"ያለፈባቸው / የተዘጉ ሥራዎች","var(--red)"],[pendingAds,"በመጠባበቅ ላይ ያሉ ማስታወቂያዎች","var(--info)"]]
    .map(s => `<div class="card stat" style="border-left:4px solid ${s[2]}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
  $("#rows").innerHTML = jobs.length ? jobs.map(j => `<tr><td><b>${esc(j.title)}</b>${j.vip?' <span class="badge b-vip">VIP</span>':""}</td><td>${esc(j.company)}</td><td>${fmt(j.deadline)}</td><td><span class="badge ${isOpen(j)?"b-open":"b-closed"}">${isOpen(j)?"ንቁ":"ያለፈበት"}</span></td><td class="acts"><button class="btn ghost sm" data-t="${j.id}">${j.active?"ዝጋ":"እንደገና ክፈት"}</button><button class="btn danger sm" data-d="${j.id}">ሰርዝ</button></td></tr>`).join("")
    : '<tr><td colspan="5" class="empty">እስካሁን ሥራ የለም። ከላይ ያለውን ፎርም ይጠቀሙ።</td></tr>';
}

$("#rows").onclick = async e => {
  const t = e.target.closest("[data-t]"), d = e.target.closest("[data-d]");
  try {
    if(t){ const j = jobs.find(x => x.id===t.dataset.t); await updateDoc(doc(db,"jobs",j.id), {active: !j.active}); toast(j.active ? "ሥራው ተዘግቷል" : "ሥራው እንደገና ተከፍቷል"); }
    if(d && confirm("ይህን ሥራ ይሰርዙ?")){ await deleteDoc(doc(db,"jobs",d.dataset.d)); toast("ሥራው ተሰርዟል"); }
  } catch(err){ console.error(err); toast("አልተሳካም። ፈቃድዎን ያረጋግጡ።"); }
};

$("#form").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try {
    await addDoc(collection(db,"jobs"), { title:f.title, company:f.company, sector:f.sector, type:f.type, salary:f.salary, location:f.location, deadline:f.deadline, vip:!!f.vip, active:true, desc:f.desc, createdAt:serverTimestamp() });
    e.target.reset(); e.target.location.value = "ጅማ"; toast("ሥራው ታትሟል");
  } catch(err){ console.error(err); toast("ማተም አልተቻለም። ፈቃድዎን ያረጋግጡ።"); }
};
</script>
</body>
</html>
